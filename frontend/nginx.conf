server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/html text/css application/javascript application/json;

    # index.html sempre revalida (ETag → 304), para um deploy aparecer na hora.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Estáticos sem hash no nome: cache de 1 dia, depois revalida pelo ETag.
    # Não usar "immutable" — um rebuild troca o conteúdo sem trocar a URL.
    location ~ ^/(support\.js|favicon\.svg|_ds/) {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # O frontend chama a API por caminho relativo (/api/...). Resolver + variável
    # fazem o nginx resolver "api" a cada requisição: sobe mesmo se a API ainda
    # não estiver no ar e acompanha a troca de IP quando o container reinicia.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
