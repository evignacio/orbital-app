# Cabeçalhos de segurança, incluídos em TODOS os locations do default.conf.template.
# Armadilha do nginx: um location com add_header próprio descarta os add_header do
# server, então este arquivo é repetido (include) em cada location, e não posto só no
# server. "always" para saírem também em 404/5xx. Sem HSTS aqui: este nginx fala HTTP
# puro — o HSTS fica no front TLS opcional (Caddyfile, docker-compose.tls.yml).
#
# CSP:
# - script-src 'self': nada inline (o tema antes da pintura está em /theme-boot.js).
# - style-src 'self' + style-src-attr 'unsafe-inline': folhas de estilo só da própria
#   origem (o antigo <style> inline virou /theme-boot.css), mas atributos style="…"
#   são liberados porque viz/comet.ts e viz/clouds.ts montam SVG/HTML com style="…"
#   via .html() (innerHTML), o que a CSP bloquearia. Estilos via CSSOM (d3 .style(),
#   prop style do React) não passam pela CSP. Atributo style não executa script; o
#   risco que sobra é só injeção de CSS. Trocar esses style="…" por atributos SVG
#   (fill) / CSSOM permitiria remover o style-src-attr.
# - img-src data: para eventuais SVG/imagens inline em CSS; font-src 'self' porque as
#   fontes vêm do bundle (@fontsource), sem Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
