services:
  mongo:
    image: mongo:7
    environment:
      # The entrypoint runs the seed below against this database on first boot.
      MONGO_INITDB_DATABASE: orbital
    volumes:
      - mongo_data:/data/db
      - ./mongo-seed.js:/docker-entrypoint-initdb.d/mongo-seed.js:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: orbital
      REDIS_URL: redis://redis:6379
      SYNC_CACHE_TTL: "13"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongo_data:
